name: BEAT4 native iOS build (independent of XONE)
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, "fix/r10-*"]
    paths:
      - 'Beat4AU/**'
      - 'Beat4App/**'
      - 'Beat4.xcodeproj/**'
      - 'Tests/**'
      - '.github/workflows/ios.yml'
jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: C++ portable tests
        run: bash Tests/run.sh
      - name: C++ sanitizers (ASan / UBSan)
        env:
          BEAT4_SANITIZE: '1'
        run: bash Tests/run.sh
  ios-source-build:
    runs-on: macos-15
    needs: core-tests
    steps:
      - uses: actions/checkout@v4
      - name: Show build environment
        run: xcodebuild -version
      - name: Compile unsigned BEAT4 container and extension
        run: |
          xcodebuild -project Beat4.xcodeproj \
            -scheme Beat4App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/Beat4DerivedData" \
            CODE_SIGNING_ALLOWED=NO build
