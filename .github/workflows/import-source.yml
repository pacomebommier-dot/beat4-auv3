name: Import BEAT4 V0.5 sources and build iOS
on:
  push:
    branches: [main]
    paths: [BEAT4_AUv3_V0_5_Xcode.zip]
permissions:
  contents: write
jobs:
  expand-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Unpack BEAT4 source staging archive
        run: |
          set -euo pipefail
          test -s BEAT4_AUv3_V0_5_Xcode.zip
          mkdir -p "$RUNNER_TEMP/beat4"
          unzip -q BEAT4_AUv3_V0_5_Xcode.zip -d "$RUNNER_TEMP/beat4"
          test -f "$RUNNER_TEMP/beat4/BEAT4_AUv3_V0_5/Beat4.xcodeproj/project.pbxproj"
          rsync -a --exclude='.github/' "$RUNNER_TEMP/beat4/BEAT4_AUv3_V0_5/" ./
      - name: Run C++ unit tests
        run: bash Tests/run.sh
      - name: Run C++ ASan and UBSan tests
        env:
          BEAT4_SANITIZE: '1'
        run: bash Tests/run.sh
      - name: Commit expanded source files and remove archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Beat4.xcodeproj Beat4AU Beat4App Tests Tools docs audio-demo README.md .gitignore
          git rm BEAT4_AUv3_V0_5_Xcode.zip
          git commit -m "Publish BEAT4 V0.5 AUv3 source code and tests"
          git push origin HEAD:main
  build-ios:
    runs-on: macos-15
    needs: expand-and-test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Xcode version
        run: xcodebuild -version
      - name: Build unsigned BEAT4 AUv3 container
        run: |
          xcodebuild -project Beat4.xcodeproj \
            -scheme Beat4App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/Beat4DerivedData" \
            CODE_SIGNING_ALLOWED=NO build
      - name: Create unsigned IPA archive
        run: |
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -a "$RUNNER_TEMP/Beat4DerivedData/Build/Products/Release-iphoneos/BEAT4.app" "$RUNNER_TEMP/Payload/"
          (cd "$RUNNER_TEMP" && zip -qry "$GITHUB_WORKSPACE/BEAT4_UNSIGNED.ipa" Payload)
      - uses: actions/upload-artifact@v4
        with:
          name: BEAT4-UNSIGNED-IPA
          path: BEAT4_UNSIGNED.ipa
          if-no-files-found: error
