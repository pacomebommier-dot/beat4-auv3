name: Bootstrap BEAT4 V0.5 sources and build iOS
on:
  push:
    branches: [main]
    paths: [BEAT4_SOURCE_V05.b64]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  expand-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Expand compact transport into normal source files
        run: |
          set -euo pipefail
          test -s BEAT4_SOURCE_V05.b64
          mkdir -p "$RUNNER_TEMP/beat4"
          base64 -d BEAT4_SOURCE_V05.b64 | tar -xJf - -C "$RUNNER_TEMP/beat4"
          test -f "$RUNNER_TEMP/beat4/BEAT4_AUv3_V0_5/Beat4.xcodeproj/project.pbxproj"
          rsync -a --exclude='.github/' "$RUNNER_TEMP/beat4/BEAT4_AUv3_V0_5/" ./
      - name: Portable tests
        run: bash Tests/run.sh
      - name: ASan and UBSan
        env:
          BEAT4_SANITIZE: '1'
        run: bash Tests/run.sh
      - name: Commit unpacked sources (no binary transport left)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Beat4.xcodeproj Beat4AU Beat4App Tests Tools docs README.md .gitignore
          git rm -f BEAT4_SOURCE_V05.b64
          git commit -m "Publish BEAT4 V0.5 AUv3 sources and portable tests"
          git push origin HEAD:main
  build-ios:
    runs-on: macos-15
    needs: expand-and-test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Xcode
        run: xcodebuild -version
      - name: Build unsigned BEAT4 app and extension
        run: |
          xcodebuild -project Beat4.xcodeproj \
            -scheme Beat4App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/Beat4DerivedData" \
            CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned IPA
        run: |
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -a "$RUNNER_TEMP/Beat4DerivedData/Build/Products/Release-iphoneos/BEAT4.app" "$RUNNER_TEMP/Payload/"
          (cd "$RUNNER_TEMP" && zip -qry "$GITHUB_WORKSPACE/BEAT4_UNSIGNED.ipa" Payload)
      - uses: actions/upload-artifact@v4
        with:
          name: BEAT4-UNSIGNED-IPA
          path: BEAT4_UNSIGNED.ipa
          if-no-files-found: error
